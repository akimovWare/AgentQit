<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders Lab — AgentQit</title>
<style>
  :root { color-scheme: light; font: 16px/1.5 system-ui,sans-serif; color:#172b38; background:#f3f6f8 }
  body { max-width:900px; margin:64px auto; padding:0 24px }
  .eyebrow { color:#526b7a; font-size:13px; letter-spacing:.14em; text-transform:uppercase }
  h1 { font-size:40px; letter-spacing:-.04em; margin:8px 0 }
  .intro { color:#526b7a; max-width:640px }
  section { background:white; border:1px solid #dce5ea; border-radius:14px; padding:24px; margin-top:24px }
  form { display:flex; gap:14px; align-items:end }
  label { flex:1; font-weight:600 }
  input { box-sizing:border-box; width:100%; margin-top:8px; padding:11px 12px; border:1px solid #aebfc9; border-radius:6px; font:inherit }
  button { padding:12px 18px; border:0; border-radius:6px; background:#086b62; color:white; font:inherit; cursor:pointer }
  button:disabled { opacity:.5; cursor:default }
  .order { padding:18px 0; border-bottom:1px solid #e5ecef; display:flex; align-items:center; gap:18px }
  .order:last-child { border-bottom:0 }
  .order-main { flex:1 }
  .title { font-weight:650 }
  .id { color:#637b88; font:12px/1.5 ui-monospace,monospace; margin-top:5px }
  .status { background:#e4f3ed; color:#155f48; border-radius:20px; padding:4px 12px; font-size:13px; font-weight:650 }
  .secondary { color:#344e5d; border:1px solid #b6c7d0; background:white }
  #notice { min-height:24px; color:#526b7a; margin-top:12px }
  footer { color:#637b88; font-size:13px; margin-top:24px }
</style>
<p class="eyebrow">AgentQit · Local application</p>
<h1>Orders Lab</h1>
<p class="intro">A small application for observing UI actions and backend effects. All records here are synthetic.</p>
<section aria-labelledby="create-heading">
  <h2 id="create-heading">Create an order</h2>
  <form id="create-form">
    <label for="title">Order title<input id="title" maxlength="100" required autocomplete="off" placeholder="Example: Review sample"></label>
    <button type="submit">Create order</button>
  </form>
  <div id="notice" role="status" aria-live="polite"></div>
</section>
<section aria-labelledby="orders-heading">
  <h2 id="orders-heading">Orders</h2>
  <div id="orders" aria-live="polite">Loading orders…</div>
</section>
<footer>State: CREATED → CANCELLED. Use the API to independently observe each order.</footer>
<script>
const defectUi = __DEFECT_UI__;
const notice = document.getElementById('notice');
async function request(path, body) {
  const response = await fetch(path, {method:'POST',headers:{'Content-Type':'application/json',
    'idempotency-key':crypto.randomUUID()},body:JSON.stringify(body || {})});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Request failed');
  return data;
}
async function refresh() {
  const data = await (await fetch('/api/orders')).json();
  const container = document.getElementById('orders');
  container.replaceChildren();
  if (!data.orders.length) { container.textContent = 'No orders yet.'; return; }
  for (const order of data.orders) {
    const row = document.createElement('article'); row.className='order';
    const main=document.createElement('div'); main.className='order-main';
    const title=document.createElement('div'); title.className='title'; title.textContent=order.title;
    const id=document.createElement('div'); id.className='id'; id.textContent=order.id;
    main.append(title,id);
    const status=document.createElement('span'); status.className='status';
    status.textContent=defectUi && order.status==='CANCELLED' ? 'CREATED' : order.status;
    const cancel=document.createElement('button'); cancel.className='secondary'; cancel.textContent='Cancel order';
    cancel.setAttribute('aria-label','Cancel order '+order.title); cancel.disabled=order.status!=='CREATED';
    cancel.onclick=async()=>{try {await request('/api/orders/'+order.id+'/cancel'); await refresh();
      notice.textContent='Cancellation request completed.';} catch(error) {notice.textContent=error.message;}};
    row.append(main,status,cancel); container.append(row);
  }
}
document.getElementById('create-form').onsubmit=async event=>{
  event.preventDefault(); const title=document.getElementById('title');
  try {const order=await request('/api/orders',{title:title.value}); title.value='';
    await refresh(); notice.textContent='Created order '+order.id;} catch(error) {notice.textContent=error.message;}
};
refresh().catch(error=>notice.textContent=error.message);
</script>
</html>

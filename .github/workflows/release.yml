name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical package version (without v)
        required: true
        type: string
      publish:
        description: Publish verified artifacts (requires separate repository activation)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agentqit-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      PUBLICATION_ENABLED: ${{ vars.AGENTQIT_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv build
      - run: uv run python tools/verify_wheel.py dist
      - run: uv run python tools/verify_archives.py dist
      - run: uv run twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify release identity and write checksums
        shell: bash
        run: |
          flags=()
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            test "$PUBLICATION_ENABLED" = "true"
            test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"
            flags+=(--require-tag)
          fi
          uv run python tools/release_check.py dist --version "$RELEASE_VERSION" "${flags[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agentqit-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish && vars.AGENTQIT_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: agentqit-release
          path: release/
      - name: Verify retained checksums and select distribution files
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import shutil
          source = pathlib.Path('release')
          manifest = json.loads((source / 'release-manifest.json').read_text())
          assert manifest['tag_verified'] is True
          destination = pathlib.Path('dist')
          destination.mkdir()
          for name, details in manifest['files'].items():
              assert pathlib.Path(name).name == name
              assert name.endswith(('.whl', '.tar.gz'))
              path = source / name
              assert path.stat().st_size == details['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == details['sha256']
              shutil.copyfile(path, destination / name)
          assert len(list(destination.iterdir())) == 2
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

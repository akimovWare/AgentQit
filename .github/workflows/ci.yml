name: Validate

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run python tools/check_public_content.py
      - run: uv run ruff check src tests tools examples/orders/src
      - run: uv run ruff format --check src tests tools examples/orders/src
      - run: uv run pre-commit run --all-files
      - run: uv run python tools/export_contracts.py --check
      - run: uv run pytest
      - run: uv build
      - run: uv run python tools/verify_wheel.py dist
      - run: uv run python tools/verify_archives.py dist
      - run: uv run twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv venv .installed-check
      - run: uv pip install --python .installed-check/bin/python dist/*.whl
      - name: Verify isolated installation outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.installed-check/bin/python" -I "$GITHUB_WORKSPACE/tools/smoke_installed.py" --output "$RUNNER_TEMP/agentqit-smoke"

  browser:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra browser
      - run: uv run playwright install --with-deps chromium --only-shell
      - run: uv run pytest -m browser
        env:
          AGENTQIT_BROWSER_TESTS: "1"

  context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python tools/check_public_content.py
      - name: Verify CLI/MCP workflows and catalog-size independence
        run: uv run python tools/benchmark_interfaces.py --output .agentqit/context-review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interface-context-summary
          path: .agentqit/context-review/summary.json
          if-no-files-found: error


  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python tools/check_public_content.py
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan reachable history without exposing matched values
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" .'

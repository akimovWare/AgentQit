[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agentqit"
version = "0.1.0"
description = "Application testing tools for AI agents"
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "aiokafka>=0.12,<1",
    "anyio>=4.8,<5",
    "asyncpg>=0.30,<1",
    "botocore>=1.42,<2",
    "defusedxml>=0.7,<1",
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "protobuf>=5,<7",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjks>=20,<21",
    "pyyaml>=6.0,<7",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
]

[project.urls]
Source = "https://github.com/akimovWare/AgentQit"
Documentation = "https://github.com/akimovWare/AgentQit/blob/main/README.md"
Issues = "https://github.com/akimovWare/AgentQit/issues"
Changelog = "https://github.com/akimovWare/AgentQit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]

[project.scripts]
qa = "qa_cli.app:main"
agentqit-mcp = "qa_mcp.__main__:main"

[dependency-groups]
dev = [
    "packaging>=24,<27",
    "pre-commit>=4.6,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.9,<1",
    "tiktoken>=0.12,<1",
    "twine>=7,<8",
]

[tool.uv]
native-tls = true

[tool.hatch.build.targets.wheel]
packages = ["src/qa_runtime", "src/qa_cli", "src/qa_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "tools", "pyproject.toml", "uv.lock", "README.md", "README.pypi.md", "LICENSE", "AGENTS.md", "CONTRIBUTING.md", "CHANGELOG.md", "SECURITY.md", "SUPPORT.md", "CODE_OF_CONDUCT.md", ".github", ".gitignore", ".pre-commit-config.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["browser: requires explicitly provisioned browsers and synthetic loopback fixtures"]

[tool.coverage.run]
branch = true
source = ["qa_runtime", "qa_cli"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
